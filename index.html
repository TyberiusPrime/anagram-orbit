<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anagram Orbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#080a16;
    --void-2:#0d1128;
    --panel:#11152c;
    --panel-2:#161a36;
    --line:#262c52;
    --star:#eef1ff;
    --dim:#8890c0;
    --cyan:#6fe3ff;
    --violet:#b18cff;
    --gold:#ffcf6f;
    --green:#6ef0a8;
    --red:#ff6b6b;
    --amber:#ffab5e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:var(--void);
    color:var(--star);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
    position:relative;
  }
  canvas#stars{
    position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none;
  }
  .nebula{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 60% 40% at 15% 10%, rgba(177,140,255,0.16), transparent 60%),
      radial-gradient(ellipse 50% 35% at 85% 15%, rgba(111,227,255,0.12), transparent 60%),
      radial-gradient(ellipse 55% 45% at 50% 100%, rgba(111,240,168,0.08), transparent 60%);
  }
  .wrap{
    position:relative; z-index:1;
    max-width:1080px; margin:0 auto; padding:28px 20px 80px;
  }

  /* ---------- Header ---------- */
  header{
    display:flex; justify-content:space-between; align-items:flex-start;
    flex-wrap:wrap; gap:16px; margin-bottom:22px;
  }
  .brand h1{
    font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:clamp(28px,4vw,38px); margin:0; letter-spacing:0.5px;
    background:linear-gradient(90deg,#eef1ff,var(--cyan) 60%,var(--violet));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand p{margin:4px 0 0; color:var(--dim); font-size:13px; letter-spacing:0.4px;}
  .hud{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .mode-badge{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:1.5px;
    padding:6px 10px; border-radius:20px; border:1px solid var(--line);
    color:var(--cyan); background:rgba(111,227,255,0.06); text-transform:uppercase;
  }
  .cat-pill{
    display:inline-block; margin-left:8px; padding:2px 8px; border-radius:20px;
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:1px;
    text-transform:uppercase; color:var(--violet); border:1px solid var(--line);
    background:rgba(177,140,255,0.08); vertical-align:middle;
  }
  .cat-pill:empty{display:none;}
  .timer{
    font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600;
    padding:8px 16px; border-radius:12px; border:1px solid var(--line);
    background:var(--panel); min-width:104px; text-align:center;
    box-shadow:0 0 0 1px rgba(111,227,255,0.05) inset;
  }
  .timer.penalty-flash{animation:penalty 0.6s ease;}
  @keyframes penalty{0%{color:var(--red);}100%{color:var(--star);}}
  .ghost{
    font-family:'Inter',sans-serif; font-size:13px; font-weight:600;
    background:transparent; color:var(--star); border:1px solid var(--line);
    padding:9px 14px; border-radius:10px; cursor:pointer; transition:all .15s ease;
  }
  .ghost:hover{border-color:var(--cyan); color:var(--cyan); background:rgba(111,227,255,0.06);}
  select.ghost{
    -webkit-appearance:none; appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%238890c0'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center;
    padding-right:30px;
  }
  select.ghost option{background:var(--panel-2); color:var(--star);}

  /* ---------- Progress ---------- */
  .progress-row{
    display:flex; gap:6px; flex-wrap:wrap; margin-bottom:26px; justify-content:center;
  }
  .dot{
    width:16px; height:16px; border-radius:50%;
    border:1.5px solid var(--line); background:transparent;
    transition:all .25s ease;
  }
  .dot.current{border-color:var(--cyan); box-shadow:0 0 10px 1px var(--cyan); animation:pulse 1.6s infinite ease-in-out;}
  .dot.solved{background:var(--green); border-color:var(--green); box-shadow:0 0 8px rgba(110,240,168,0.6);}
  .dot.skipped{background:var(--amber); border-color:var(--amber); box-shadow:0 0 8px rgba(255,171,94,0.5);}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.25);}}

  /* ---------- Layout ---------- */
  .board{display:flex; flex-direction:column; gap:20px;}

  .card{
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--line); border-radius:20px; padding:28px;
    position:relative; overflow:hidden;
  }
  .card::before{
    content:''; position:absolute; top:-40%; right:-20%; width:60%; height:140%;
    background:radial-gradient(circle,rgba(111,227,255,0.06),transparent 65%);
    pointer-events:none;
  }
  .word-count{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--dim);
    letter-spacing:2px; text-transform:uppercase; margin-bottom:18px;
  }

  /* answer slots */
  .slots{
    display:flex; gap:4px; justify-content:center; flex-wrap:wrap;
    margin-bottom:26px; min-height:44px;
  }
  .slot{
    width:clamp(22px,7vw,34px); height:40px; border-radius:6px;
    border:2px dashed var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px;
    color:var(--star); transition:all .15s ease; background:rgba(255,255,255,0.02);
  }
  .slot.filled{border-style:solid; border-color:var(--cyan); background:rgba(111,227,255,0.08); box-shadow:0 0 12px rgba(111,227,255,0.25);}
  .slot.correct{
    border-color:var(--green); background:rgba(110,240,168,0.12); box-shadow:0 0 14px rgba(110,240,168,0.35); color:var(--green);
    animation:happyWiggle .55s ease;
  }
  .shake-red .slot{animation:shake .5s ease;}
  .shake-red .slot.filled{border-color:var(--red)!important; background:rgba(255,107,107,0.12)!important; box-shadow:0 0 14px rgba(255,107,107,0.4)!important;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-6px);}
    40%{transform:translateX(6px);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(4px);}
  }
  @keyframes happyWiggle{
    0%{transform:scale(1) rotate(0deg);}
    25%{transform:scale(1.22) rotate(-10deg);}
    50%{transform:scale(0.92) rotate(8deg);}
    75%{transform:scale(1.1) rotate(-4deg);}
    100%{transform:scale(1) rotate(0deg);}
  }

  .divider{
    text-align:center; color:var(--dim); font-size:11px; letter-spacing:2px;
    text-transform:uppercase; margin-bottom:20px; font-family:'IBM Plex Mono',monospace;
  }

  /* tile grid — hexagon "star nodes", fixed positions */
  .tiles{
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:24px;
  }
  .tile{
    position:relative;
    width:58px; height:58px;
    clip-path:polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0% 50%);
    background:linear-gradient(145deg,#1b2044,#141834);
    border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px;
    color:var(--star);
    transition:transform .12s ease, background .15s ease, box-shadow .15s ease;
  }
  .tile:hover:not(.used){transform:translateY(-3px); background:linear-gradient(145deg,#232a56,#1a1f42);}
  .tile.used{
    background:linear-gradient(145deg, rgba(111,227,255,0.28), rgba(177,140,255,0.18));
    color:var(--void); box-shadow:0 0 14px rgba(111,227,255,0.45);
  }
  .tile.hinted{
    background:linear-gradient(145deg, rgba(255,207,111,0.55), rgba(255,171,94,0.35));
    color:var(--void); box-shadow:0 0 16px rgba(255,207,111,0.6);
    cursor:default;
  }
  .tile.hinted:hover{transform:none;}
  .tile.happy{animation:happyWiggle .55s ease;}
  .tile.hinted .badge{background:var(--gold);}
  .tile .badge{
    position:absolute; top:-6px; right:-2px;
    width:16px; height:16px; border-radius:50%;
    background:var(--cyan); color:var(--void);
    font-family:'IBM Plex Mono',monospace; font-size:9px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }

  .actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:6px;}
  .actions button{
    font-family:'Inter',sans-serif; font-size:13px; font-weight:600;
    padding:10px 16px; border-radius:10px; cursor:pointer;
    border:1px solid var(--line); background:rgba(255,255,255,0.02); color:var(--star);
    transition:all .15s ease;
  }
  .actions button:hover:not(:disabled){border-color:var(--gold); color:var(--gold);}
  .actions button:disabled{opacity:0.35; cursor:not-allowed;}
  .actions button.skip:hover:not(:disabled){border-color:var(--red); color:var(--red);}

  @keyframes fadeup{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .def-hint{
    margin-top:18px; padding:14px 18px; border-radius:14px;
    background:rgba(177,140,255,0.08); border:1px solid rgba(177,140,255,0.35);
    display:none;
  }
  .def-hint.show{display:block; animation:fadeup .35s ease;}
  .def-hint .dh-label{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:1.5px;
    text-transform:uppercase; color:var(--violet); margin-bottom:4px;
  }
  .def-hint .dh-text{color:var(--star); font-size:14px; line-height:1.5; opacity:0.9;}

  /* ---------- History panel ---------- */
  .log{
    background:var(--panel); border:1px solid var(--line); border-radius:20px;
    padding:18px 20px; max-height:260px; display:flex; flex-direction:column;
  }
  .log h3{
    margin:0 0 4px; font-family:'Space Grotesk',sans-serif; font-size:15px; letter-spacing:1px;
    text-transform:uppercase; color:var(--dim);
  }
  .log .sub{font-size:11px; color:var(--dim); margin-bottom:14px; font-family:'IBM Plex Mono',monospace;}
  .log-list{overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:10px; padding-right:4px;}
  .log-list::-webkit-scrollbar{width:6px;}
  .log-list::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px;}
  .log-entry{
    border:1px solid var(--line); border-radius:12px; padding:10px 12px;
    background:rgba(255,255,255,0.02);
  }
  .log-entry.skip{border-color:rgba(255,171,94,0.4); background:rgba(255,171,94,0.05);}
  .log-entry.flash-win{animation:logFlashWin 2s ease-out;}
  .log-entry.flash-skip{animation:logFlashSkip 2s ease-out;}
  @keyframes logFlashWin{
    0%{background:rgba(110,240,168,0.35); border-color:var(--green);}
    100%{background:rgba(255,255,255,0.02); border-color:var(--line);}
  }
  @keyframes logFlashSkip{
    0%{background:rgba(255,171,94,0.45); border-color:var(--amber);}
    100%{background:rgba(255,171,94,0.05); border-color:rgba(255,171,94,0.4);}
  }
  .log-entry .lw{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .log-entry .lw span.tag{
    font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:500;
    padding:2px 6px; border-radius:6px;
  }
  .log-entry.win .lw span.tag{background:rgba(110,240,168,0.15); color:var(--green);}
  .log-entry.skip .lw span.tag{background:rgba(255,171,94,0.15); color:var(--amber);}
  .log-entry .ld{font-size:12px; color:var(--dim); margin-top:4px; line-height:1.4;}
  .log-empty{color:var(--dim); font-size:13px; text-align:center; padding:30px 10px; font-style:italic;}

  /* ---------- End screen ---------- */
  .end-card{text-align:center;}
  .end-card .big-time{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:52px; color:var(--cyan);
    text-shadow:0 0 24px rgba(111,227,255,0.5); margin:8px 0 4px;
  }
  .end-card p.tag{color:var(--dim); font-size:13px; letter-spacing:1px; text-transform:uppercase;}
  .end-stats{display:flex; gap:24px; justify-content:center; margin:22px 0; flex-wrap:wrap;}
  .end-stats div{text-align:center;}
  .end-stats .n{font-family:'Space Grotesk',sans-serif; font-size:24px; font-weight:700;}
  .end-stats .l{font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:1px;}
  .end-actions{display:flex; gap:12px; justify-content:center; margin-top:18px; flex-wrap:wrap;}
  .end-actions button{
    font-family:'Inter',sans-serif; font-weight:700; font-size:14px;
    padding:12px 22px; border-radius:12px; cursor:pointer; border:none;
  }
  .end-actions .primary{background:linear-gradient(90deg,var(--cyan),var(--violet)); color:#08091a;}
  .end-actions .secondary{background:transparent; border:1px solid var(--line); color:var(--star);}

  .sparkle-layer{
    position:fixed; inset:0; z-index:5; pointer-events:none; overflow:hidden;
  }
  .spark{
    position:absolute; left:50%; top:38%;
    clip-path:polygon(50% 0%, 65% 35%, 100% 50%, 65% 65%, 50% 100%, 35% 65%, 0% 50%, 35% 35%);
    opacity:0;
    animation-name:sparkleBurst;
    animation-timing-function:cubic-bezier(.2,.8,.3,1);
    animation-fill-mode:forwards;
  }
  @keyframes sparkleBurst{
    0%{transform:translate(-50%,-50%) scale(0) rotate(0deg); opacity:0;}
    12%{opacity:1;}
    100%{
      transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(340deg);
      opacity:0;
    }
  }

  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important; transition:none!important;}
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="nebula"></div>
<div class="sparkle-layer" id="sparkleLayer"></div>

<div class="wrap">
  <header>
    <div class="brand">
      <h1 id="pageTitle">Anagram Orbit</h1>
      <p id="subtitle">Unscramble 18 words. Chart your fastest orbit.</p>
    </div>
    <div class="hud">
      <span class="mode-badge" id="modeBadge">DAILY</span>
      <div class="timer" id="timer">00:00</div>
      <select class="ghost" id="packSelect" title="Choose word pack / language">
        <option value="all">🌐 English</option>
        <option value="animals">🐾 English · Animals</option>
        <option value="de">🇩🇪 Deutsch</option>
      </select>
      <button class="ghost" id="randomBtn">New Random Game</button>
    </div>
  </header>

  <div class="progress-row" id="progressRow"></div>

  <div class="board" id="board"></div>
</div>

<script>
/* ============ Starfield background ============ */
(function(){
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let w,h,stars=[];
  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    const count = Math.floor((w*h)/9000);
    stars = Array.from({length:count},()=>({
      x:Math.random()*w, y:Math.random()*h,
      r:Math.random()*1.3+0.3,
      phase:Math.random()*Math.PI*2,
      speed:Math.random()*0.02+0.008
    }));
  }
  function draw(t){
    ctx.clearRect(0,0,w,h);
    for(const s of stars){
      const tw = 0.55 + Math.sin(t*s.speed + s.phase)*0.45;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(238,241,255,${tw.toFixed(2)})`;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
})();

/* ============ i18n strings ============ */
/* Every user-facing label lives here, keyed by language, so the two

/* ============ Word banks ============ */
/* Each language has its own primary bank, fetched at startup from a JSON
   file (English: wordnet_words.json, 15k+ words with definitions and
   categories, derived from Princeton WordNet; German: dewiktionary_words.json,
   6k+ words with definitions and word-class, extracted from the German
   Wiktionary via kaikki.org/wiktextract). The fallback lists below are only
   an emergency fallback for when that fetch fails (e.g. the page was opened
   directly as a file:// URL with no local server, so fetch() of a sibling
   JSON file is blocked by the browser). */
const FALLBACK_BANK_EN = [
  {word:"GALAXY", def:"a vast system of stars, gas, and dust bound together by gravity", category:""},
  {word:"NEBULA", def:"a giant interstellar cloud of dust and gas, often where stars are born", category:""},
  {word:"ORBIT", def:"the curved path an object follows around a star, planet, or moon", category:""},
  {word:"COMET", def:"an icy body that glows and grows a tail as it nears the sun", category:""},
  {word:"METEOR", def:"a streak of light from debris burning up in a planet's atmosphere", category:""},
  {word:"PLANET", def:"a large celestial body that orbits a star and has cleared its path", category:""},
  {word:"ROCKET", def:"a vehicle propelled forward by expelling exhaust gases", category:""},
  {word:"SHUTTLE", def:"a reusable spacecraft designed for repeated trips to orbit", category:""},
  {word:"ASTEROID", def:"a small rocky body, smaller than a planet, orbiting the sun", category:""},
  {word:"GRAVITY", def:"the force that pulls objects toward one another", category:""},
  {word:"HORIZON", def:"the line where the sky appears to meet the land or sea", category:""},
  {word:"CRATER", def:"a bowl-shaped hollow formed by an impact or explosion", category:""},
  {word:"ECLIPSE", def:"the blocking of light from one celestial body by another", category:""},
  {word:"VOYAGE", def:"a long journey, especially by sea, air, or through space", category:""},
  {word:"CAPSULE", def:"a small sealed compartment, often used to carry a crew", category:""},
  {word:"SATELLITE", def:"an object that orbits a planet, natural or human-made", category:""},
  {word:"TELESCOPE", def:"an instrument used to view distant objects in detail", category:""},
  {word:"UNIVERSE", def:"all of space, time, matter, and energy that exists", category:""},
  {word:"COSMOS", def:"the universe considered as a vast, orderly, harmonious system", category:""},
  {word:"STARDUST", def:"fine particles of matter scattered by dying stars", category:""}
];
const FALLBACK_BANK_DE = [
  {word:"GALAXIE", def:"ein riesiges System aus Sternen, Gas und Staub, das durch Schwerkraft zusammengehalten wird", category:""},
  {word:"NEBEL", def:"eine riesige interstellare Wolke aus Staub und Gas, oft der Geburtsort von Sternen", category:""},
  {word:"UMLAUFBAHN", def:"der gekrümmte Pfad, dem ein Objekt um einen Stern, Planeten oder Mond folgt", category:""},
  {word:"KOMET", def:"ein eisiger Körper, der beim Näherkommen an die Sonne leuchtet und einen Schweif bildet", category:""},
  {word:"METEOR", def:"ein Lichtstreifen von Trümmern, die in der Atmosphäre eines Planeten verglühen", category:""},
  {word:"PLANET", def:"ein großer Himmelskörper, der einen Stern umkreist und seine Bahn freigeräumt hat", category:""},

  {word:"HORIZONT", def:"die Linie, an der der Himmel den Boden oder das Meer zu berühren scheint", category:""},
  {word:"KRATER", def:"eine schüsselförmige Vertiefung, die durch einen Einschlag oder eine Explosion entsteht", category:""},
  {word:"FINSTERNIS", def:"die Verdunkelung des Lichts eines Himmelskörpers durch einen anderen", category:""},
  {word:"REISE", def:"eine lange Fahrt, besonders zu Wasser, in der Luft oder durch den Weltraum", category:""},
  {word:"KAPSEL", def:"ein kleiner, abgeschlossener Raum, oft zum Transport einer Besatzung genutzt", category:""},
  {word:"SATELLIT", def:"ein Objekt, das einen Planeten umkreist, natürlich oder künstlich", category:""},
  {word:"TELESKOP", def:"ein Instrument zur detaillierten Betrachtung entfernter Objekte", category:""},
  {word:"UNIVERSUM", def:"alles an Raum, Zeit, Materie und Energie, das existiert", category:""},
  {word:"KOSMOS", def:"das Universum, betrachtet als ein weites, geordnetes, harmonisches System", category:""},
  {word:"STERNENSTAUB", def:"feine Materieteilchen, die von sterbenden Sternen verstreut werden", category:""}
];
const RAW_BANKS = { en: FALLBACK_BANK_EN, de: FALLBACK_BANK_DE };
let WORD_BANK = RAW_BANKS.en;

/* "Packs" are client-side filters over a language's fetched word list — no
   extra network request needed. 'animals' keeps only WordNet's noun.animal
   category (English only, for now). Falls back to the language's full bank
   if a pack ends up too small to build a puzzle from (e.g. the compact
   fallback bank has no categories). A pack's `lang` is also what selects
   the active language everywhere else — the dropdown doubles as the
   language switcher. */
const PACKS = {
  all:     { lang:'en', filter: null },
  animals: { lang:'en', filter: w => w.category === 'noun.animal' },
  de:      { lang:'de', filter: null }
};
function defaultPackForLang(lang){ return lang === 'de' ? 'de' : 'all'; }
function getPackWords(pack){
  const cfg = PACKS[pack];
  const raw = RAW_BANKS[cfg.lang];
  if(cfg.filter){
    const filtered = raw.filter(cfg.filter);
    if(filtered.length >= 18) return filtered;
  }
  return raw;
}

/* ============ Seeded RNG (mulberry32) ============ */
function hashSeed(str){
  let h = 1779033703 ^ str.length;
  for(let i=0;i<str.length;i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return (h ^ (h >>> 16)) >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, rng){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rng()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function shuffleLetters(word, rng){
  const letters = word.split('');
  let shuffled;
  let tries = 0;
  do{
    shuffled = seededShuffle(letters, rng);
    tries++;
  } while(shuffled.join('') === word && tries < 12);
  return shuffled.map((ch,i)=>({ch, id:i, used:false}));
}

/* ============ Game state ============ */
let state = null;
let timerHandle = null;
let lastLogEntryEl = null;

/* Gradient run from the first letter picked (cyan) to the last (violet).
   Works purely off click ORDER/position, never off which physical tile —
   so duplicate letters (e.g. the two A's in GALAXY) are completely
   interchangeable: correctness and coloring both key off the character
   and the position it was placed in, never off a specific tile id. */
const GRADIENT_FROM = [111,227,255];
const GRADIENT_TO = [177,140,255];
function gradientColor(pos, total){
  const t = total > 1 ? pos/(total-1) : 0;
  return GRADIENT_FROM.map((c,i) => Math.round(c + (GRADIENT_TO[i]-c)*t));
}

function todayKey(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

/* The seed string lives in the URL hash so a puzzle can be shared by
   copying the link — whoever opens it gets the exact same words in the
   exact same shuffled order. `mode` only matters to pick a fresh seed;
   once a seed exists, DAILY vs RANDOM labeling is derived from it.
   The hash format is `<pack>:<seed>` so the word-pack/language choice
   survives a shared link too; a bare seed with no recognized pack prefix
   (older links, or a colon-free seed) is treated as pack 'all'. */
function parseHash(){
  const raw = location.hash.slice(1);
  if(!raw) return null;
  let decoded;
  try{ decoded = decodeURIComponent(raw); } catch(e){ return null; }
  const idx = decoded.indexOf(':');
  if(idx === -1) return {pack:'all', seed: decoded};
  const pack = decoded.slice(0,idx);
  const seed = decoded.slice(idx+1);
  if(!seed || !PACKS[pack]) return {pack:'all', seed: decoded};
  return {pack, seed};
}
function putHash(pack, seedStr){
  const encoded = encodeURIComponent(`${pack}:${seedStr}`);
  if(location.hash.slice(1) !== encoded){
    history.replaceState(null, '', '#' + encoded);
  }
}

/* Header chrome that doesn't live inside renderBoardShell()'s template
   (so it isn't already refreshed on every newGame()) gets updated here. */
function applyLangUI(lang){
  const S = STRINGS[lang];
  document.documentElement.lang = lang;
  document.title = S.docTitle;
  document.getElementById('pageTitle').textContent = S.h1;
  document.getElementById('packSelect').title = S.packSelectTitle;
  document.getElementById('randomBtn').textContent = S.randomBtn;
}

function newGame(mode, seedOverride, packOverride){
  let pack = PACKS[packOverride] ? packOverride : 'all';
  const cfg = PACKS[pack];
  const S = STRINGS[cfg.lang];
  const seedStr = seedOverride || (mode === 'daily'
    ? `daily-${todayKey()}`
    : `random-${Date.now()}-${Math.random()}`);
  const effectiveMode = seedStr.startsWith('daily-') ? 'daily' : 'random';
  const rng = mulberry32(hashSeed(seedStr));

  WORD_BANK = getPackWords(pack);
  if(cfg.filter && WORD_BANK === RAW_BANKS[cfg.lang]) pack = defaultPackForLang(cfg.lang); // pack fell back (too few matches)
  putHash(pack, seedStr);

  const order = seededShuffle(WORD_BANK.map((_,i)=>i), rng);
  const chosen = order.slice(0,18).map(i => WORD_BANK[i]);

  const words = chosen.map(w => ({
    word: w.word, def: w.def, category: w.category || '',
    letters: shuffleLetters(w.word, rng)
  }));

  state = {
    lang: cfg.lang,
    mode: effectiveMode,
    pack,
    words,
    currentIndex: 0,
    currentInput: [],
    hintUsed: false,
    defUsed: false,
    startTime: Date.now(),
    penaltySeconds: 0,
    wordStartTime: Date.now(),
    solved: [],
    finished: false,
    waitingForNext: false
  };

  applyLangUI(cfg.lang);
  document.getElementById('modeBadge').textContent =
    (effectiveMode === 'daily' ? S.modeDaily : S.modeRandom) + (pack === 'animals' ? S.animalsSuffix : '');
  document.getElementById('subtitle').textContent = effectiveMode === 'daily'
    ? S.subtitleDaily(todayKey())
    : S.subtitleRandom;
  document.getElementById('packSelect').value = pack;

  renderBoardShell();
  lastLogEntryEl = null;
  renderProgress();
  setupWord(0);
  startTimer();
}

function renderBoardShell(){
  // Always rebuild the board fresh (covers the very first load and
  // returning here after an end screen) and (re)attach every listener,
  // so buttons never end up wired to stale or missing elements.
  const S = STRINGS[state.lang];
  document.getElementById('board').innerHTML = `
    <div class="log">
      <h3>${S.missionLog}</h3>
      <div class="sub" id="logSub">${S.logSub(0, state.words.length)}</div>
      <div class="log-list" id="logList">
        <div class="log-empty">${S.logEmpty}</div>
      </div>
    </div>
    <div class="card" id="puzzleCard">
      <div class="word-count" id="wordCount">${S.wordCount(1, state.words.length)}</div>
      <div class="slots" id="slots"></div>
      <div class="divider">${S.selectLetters}</div>
      <div class="tiles" id="tiles"></div>
      <div class="actions">
        <button id="shuffleBtn" type="button">${S.shuffleBtn} <span style="color:var(--dim)">${S.shuffleCost}</span></button>
        <button id="hintBtn" type="button">${S.hintBtn} <span style="color:var(--dim)">${S.hintCost}</span></button>
        <button id="defBtn" type="button">${S.defBtn} <span style="color:var(--dim)">${S.defCost}</span></button>
        <button class="skip" id="skipBtn" type="button">${S.skipBtn} <span style="color:var(--dim)">${S.skipCost}</span></button>
      </div>
      <div class="def-hint" id="defHint">
        <div class="dh-label">${S.definitionLabel}</div>
        <div class="dh-text" id="defHintText"></div>
      </div>
    </div>`;

  document.getElementById('shuffleBtn').addEventListener('click', useShuffle);
  document.getElementById('hintBtn').addEventListener('click', useHint);
  document.getElementById('defBtn').addEventListener('click', useDefinitionHint);
  document.getElementById('skipBtn').addEventListener('click', useSkip);
}

/* ---------- Rendering ---------- */
function currentWordObj(){ return state.words[state.currentIndex]; }

function setupWord(i){
  const S = STRINGS[state.lang];
  state.currentIndex = i;
  state.currentInput = [];
  state.hintUsed = false;
  state.defUsed = false;
  state.wordStartTime = Date.now();
  state.waitingForNext = false;
  const w = currentWordObj();
  w.letters.forEach(t => t.used = false);

  document.getElementById('wordCount').textContent = S.wordCount(i+1, state.words.length);
  document.getElementById('defHint').classList.remove('show');
  document.getElementById('hintBtn').disabled = false;
  document.getElementById('defBtn').disabled = false;
  document.getElementById('skipBtn').disabled = false;

  renderTiles();
  renderSlots();
  renderProgress();
}

function renderTiles(){
  const S = STRINGS[state.lang];
  const box = document.getElementById('tiles');
  box.innerHTML = '';
  const w = currentWordObj();
  w.letters.forEach(tile => {
    const btn = document.createElement('button');
    btn.className = 'tile' + (tile.used ? ' used' : '') + (tile.hinted ? ' hinted' : '');
    btn.type = 'button';
    btn.setAttribute('aria-label', tile.hinted ? S.ariaLetterLocked(tile.ch) : S.ariaLetter(tile.ch));
    btn.textContent = tile.ch;
    if(tile.used){
      const pos = state.currentInput.indexOf(tile.id);
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = pos + 1;
      btn.appendChild(badge);
      if(!tile.hinted){
        const [r,g,b] = gradientColor(pos, w.word.length);
        btn.style.background = `linear-gradient(145deg, rgba(${r},${g},${b},0.95), rgba(${r},${g},${b},0.5))`;
        btn.style.boxShadow = `0 0 14px rgba(${r},${g},${b},0.55)`;
      }
    }
    btn.addEventListener('click', () => selectTile(tile.id));
    box.appendChild(btn);
  });
}

function renderSlots(){
  const box = document.getElementById('slots');
  box.innerHTML = '';
  const w = currentWordObj();
  for(let i=0;i<w.word.length;i++){
    const slot = document.createElement('div');
    const tileId = state.currentInput[i];
    if(tileId !== undefined){
      const tile = w.letters.find(t=>t.id===tileId);
      slot.className = 'slot filled';
      slot.textContent = tile.ch;
      if(tile.hinted){
        slot.style.borderColor = 'var(--gold)';
        slot.style.background = 'rgba(255,207,111,0.15)';
        slot.style.boxShadow = '0 0 12px rgba(255,207,111,0.4)';
      } else {
        const [r,g,b] = gradientColor(i, w.word.length);
        slot.style.borderColor = `rgb(${r},${g},${b})`;
        slot.style.background = `rgba(${r},${g},${b},0.15)`;
        slot.style.boxShadow = `0 0 12px rgba(${r},${g},${b},0.35)`;
      }
    } else {
      slot.className = 'slot';
    }
    box.appendChild(slot);
  }
}

function renderProgress(){
  const S = STRINGS[state.lang];
  const row = document.getElementById('progressRow');
  row.innerHTML = '';
  for(let i=0;i<state.words.length;i++){
    const d = document.createElement('div');
    const solvedEntry = state.solved.find(s=>s.index===i);
    let cls = 'dot';
    if(solvedEntry) cls += solvedEntry.skipped ? ' skipped' : ' solved';
    else if(i === state.currentIndex && !state.finished) cls += ' current';
    d.className = cls;
    d.title = S.dotTitle(i+1);
    row.appendChild(d);
  }
}

/* ---------- Interaction ---------- */
function selectTile(tileId){
  if(state.waitingForNext || state.finished) return;
  const w = currentWordObj();
  const tile = w.letters.find(t=>t.id===tileId);

  if(tile.used){
    if(tile.hinted) return; // revealed letters are locked in place
    // remove this tile and every tile selected after it
    const pos = state.currentInput.indexOf(tileId);
    const removed = state.currentInput.slice(pos);
    state.currentInput = state.currentInput.slice(0,pos);
    removed.forEach(id => { w.letters.find(t=>t.id===id).used = false; });
  } else {
    tile.used = true;
    state.currentInput.push(tileId);
  }

  renderTiles();
  renderSlots();

  if(state.currentInput.length === w.word.length){
    checkAnswer();
  }
}

function checkAnswer(){
  const w = currentWordObj();
  const guess = state.currentInput.map(id => w.letters.find(t=>t.id===id).ch).join('');
  if(guess === w.word){
    handleCorrect();
  } else {
    handleWrong();
  }
}

function handleWrong(){
  state.waitingForNext = true;
  document.getElementById('slots').parentElement.classList.add('shake-red');
  setTimeout(() => {
    document.getElementById('slots').parentElement.classList.remove('shake-red');
    const w = currentWordObj();
    const hinted = w.letters.find(t => t.hinted);
    w.letters.forEach(t => { if(!t.hinted) t.used = false; });
    state.currentInput = hinted ? [hinted.id] : [];
    state.waitingForNext = false;
    renderTiles();
    renderSlots();
  }, 550);
}

function handleCorrect(){
  const w = currentWordObj();
  const timeTaken = Math.max(0, Math.round((Date.now() - state.wordStartTime)/1000));
  state.solved.push({index: state.currentIndex, word:w.word, def:w.def, skipped:false, timeTaken});

  // happy wiggle, staggered left-to-right across the slots...
  document.querySelectorAll('#slots .slot').forEach((s,i) => {
    s.removeAttribute('style');
    s.classList.add('correct');
    s.style.animationDelay = `${i*45}ms`;
  });
  // ...and the tiles they came from, matched by click order.
  const tileEls = document.querySelectorAll('#tiles .tile');
  state.currentInput.forEach((tileId, i) => {
    const idx = w.letters.findIndex(t => t.id === tileId);
    const el = tileEls[idx];
    if(el){
      el.classList.add('happy');
      el.style.animationDelay = `${i*45}ms`;
    }
  });

  renderProgress();
  addLogEntry(w.word, w.def, false, timeTaken, w.category);

  document.getElementById('defHint').classList.remove('show');
  document.getElementById('hintBtn').disabled = true;
  document.getElementById('defBtn').disabled = true;
  document.getElementById('skipBtn').disabled = true;
  state.waitingForNext = true;

  clearTimeout(window._autoAdvance);
  window._autoAdvance = setTimeout(()=> advanceWord(), 800);
}

function advanceWord(){
  clearTimeout(window._autoAdvance);
  const next = state.currentIndex + 1;
  if(next >= state.words.length){
    finishGame();
  } else {
    setupWord(next);
    if(lastLogEntryEl){
      lastLogEntryEl.scrollIntoView({behavior:'smooth', block:'start'});
    }
  }
}

function useShuffle(){
  if(state.waitingForNext || state.finished) return;
  const w = currentWordObj();
  for(let i = w.letters.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [w.letters[i], w.letters[j]] = [w.letters[j], w.letters[i]];
  }
  renderTiles();
}

function useHint(){
  if(state.hintUsed || state.waitingForNext || state.finished) return;
  const w = currentWordObj();
  // reset any current partial input first
  w.letters.forEach(t => t.used = false);
  state.currentInput = [];
  const firstTile = w.letters.find(t => t.ch === w.word[0]);
  firstTile.used = true;
  firstTile.hinted = true;
  state.currentInput.push(firstTile.id);

  state.hintUsed = true;
  state.penaltySeconds += 30;
  flashPenalty();
  document.getElementById('hintBtn').disabled = true;

  renderTiles();
  renderSlots();
  if(state.currentInput.length === w.word.length) checkAnswer();
}

function useDefinitionHint(){
  if(state.defUsed || state.waitingForNext || state.finished) return;
  const w = currentWordObj();
  state.defUsed = true;
  state.penaltySeconds += 60;
  flashPenalty();
  document.getElementById('defBtn').disabled = true;
  document.getElementById('defHintText').textContent = w.def;
  document.getElementById('defHint').classList.add('show');
}

function useSkip(){
  if(state.waitingForNext || state.finished) return;
  const w = currentWordObj();
  state.penaltySeconds += 120;
  flashPenalty();
  state.solved.push({index: state.currentIndex, word:w.word, def:w.def, skipped:true, timeTaken:null});
  renderProgress();
  addLogEntry(w.word, w.def, true, null, w.category);

  document.getElementById('defHint').classList.remove('show');
  document.getElementById('hintBtn').disabled = true;
  document.getElementById('defBtn').disabled = true;
  document.getElementById('skipBtn').disabled = true;
  state.waitingForNext = true;

  clearTimeout(window._autoAdvance);
  window._autoAdvance = setTimeout(()=> advanceWord(), 1000);
}

function flashPenalty(){
  const t = document.getElementById('timer');
  t.classList.remove('penalty-flash');
  void t.offsetWidth;
  t.classList.add('penalty-flash');
}

/* ---------- Mission log ---------- */
function addLogEntry(word, def, skipped, timeTaken, category){
  const S = STRINGS[state.lang];
  const list = document.getElementById('logList');
  const empty = list.querySelector('.log-empty');
  if(empty) empty.remove();

  const entry = document.createElement('div');
  entry.className = 'log-entry ' + (skipped ? 'skip flash-skip' : 'win flash-win');
  entry.innerHTML = `
    <div class="lw"><span>${word}${category ? `<span class="cat-pill">${category}</span>` : ''}</span><span class="tag">${skipped ? S.skippedTag : formatTime(timeTaken)}</span></div>
    <div class="ld">${def}</div>`;
  list.appendChild(entry);
  list.scrollTop = list.scrollHeight;
  lastLogEntryEl = entry;
  document.getElementById('logSub').textContent = S.logSub(state.solved.length, state.words.length);
}

/* ---------- Timer ---------- */
function formatTime(totalSeconds){
  const m = Math.floor(totalSeconds/60);
  const s = totalSeconds % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function startTimer(){
  clearInterval(timerHandle);
  timerHandle = setInterval(()=>{
    if(state.finished) return;
    const elapsed = Math.floor((Date.now() - state.startTime)/1000) + state.penaltySeconds;
    document.getElementById('timer').textContent = formatTime(elapsed);
  }, 250);
}

/* ---------- End screen ---------- */
const SPARK_COLORS = ['var(--cyan)','var(--violet)','var(--gold)','var(--green)'];
function launchSparkles(count){
  count = count || 90;
  const layer = document.getElementById('sparkleLayer');
  layer.innerHTML = '';
  for(let i=0;i<count;i++){
    const s = document.createElement('div');
    s.className = 'spark';
    const angle = Math.random()*Math.PI*2;
    const dist = 22 + Math.random()*46; // vmin
    const size = 5 + Math.random()*8;
    s.style.setProperty('--dx', `${Math.cos(angle)*dist}vmin`);
    s.style.setProperty('--dy', `${Math.sin(angle)*dist}vmin`);
    s.style.width = `${size}px`;
    s.style.height = `${size}px`;
    s.style.background = SPARK_COLORS[Math.floor(Math.random()*SPARK_COLORS.length)];
    s.style.boxShadow = `0 0 ${Math.round(size)}px currentColor`;
    s.style.animationDuration = `${1.1 + Math.random()*0.9}s`;
    s.style.animationDelay = `${Math.random()*0.35}s`;
    layer.appendChild(s);
  }
  setTimeout(() => { layer.innerHTML = ''; }, 2600);
}

function finishGame(){
  const S = STRINGS[state.lang];
  state.finished = true;
  clearInterval(timerHandle);
  renderProgress();
  launchSparkles();
  const totalElapsed = Math.floor((Date.now() - state.startTime)/1000) + state.penaltySeconds;
  document.getElementById('timer').textContent = formatTime(totalElapsed);

  const solvedCount = state.solved.filter(s=>!s.skipped).length;
  const skippedCount = state.solved.filter(s=>s.skipped).length;
  const hintPenalty = state.penaltySeconds; // includes both hint+skip penalties combined

  const board = document.getElementById('board');
  board.innerHTML = `
    <div class="card end-card">
      <p class="tag">${S.orbitComplete}</p>
      <div class="big-time">${formatTime(totalElapsed)}</div>
      <p class="tag">${S.totalTimeTag}</p>
      <div class="end-stats">
        <div><div class="n" style="color:var(--green)">${solvedCount}</div><div class="l">${S.solvedLabel}</div></div>
        <div><div class="n" style="color:var(--amber)">${skippedCount}</div><div class="l">${S.skippedLabel}</div></div>
        <div><div class="n" style="color:var(--cyan)">+${formatTime(hintPenalty)}</div><div class="l">${S.penaltiesLabel}</div></div>
      </div>
      <div class="end-actions">
        <button class="primary" id="playRandomAgain">${S.playRandomAgain}</button>
        <button class="secondary" id="reviewBtn">${S.reviewBtn}</button>
      </div>
    </div>
    <div class="log" style="max-height:none;">
      <h3>${S.fullMissionLog}</h3>
      <div class="sub">${S.scrollReview}</div>
      <div class="log-list" id="finalLogList" style="max-height:520px;"></div>
    </div>
  `;
  const finalList = document.getElementById('finalLogList');
  state.words.forEach((w, i) => {
    const rec = state.solved.find(s=>s.index===i);
    const entry = document.createElement('div');
    entry.className = 'log-entry ' + (rec && rec.skipped ? 'skip' : 'win');
    const tag = rec ? (rec.skipped ? S.skippedTag : formatTime(rec.timeTaken)) : '—';
    entry.innerHTML = `
      <div class="lw"><span>${i+1}. ${w.word}${w.category ? `<span class="cat-pill">${w.category}</span>` : ''}</span><span class="tag">${tag}</span></div>
      <div class="ld">${w.def}</div>`;
    finalList.appendChild(entry);
  });

  document.getElementById('playRandomAgain').addEventListener('click', ()=> newGame('random', null, state.pack));
  document.getElementById('reviewBtn').addEventListener('click', ()=>{
    finalList.scrollIntoView({behavior:'smooth', block:'start'});
  });
}

/* ---------- Keyboard support ---------- */
/* Pressing a letter key selects the next unselected tile matching that
   letter (in tile order). If every matching tile is already selected,
   it unselects the earliest-picked one instead (mirrors clicking it),
   which also un-does anything selected after it. */
function letterKeyPress(letter){
  const w = currentWordObj();
  const matches = w.letters.filter(t => t.ch.toUpperCase() === letter);
  if(!matches.length) return;
  const unused = matches.find(t => !t.used);
  if(unused){
    selectTile(unused.id);
    return;
  }
  const selectable = matches.filter(t => !t.hinted);
  if(!selectable.length) return;
  let first = null, firstPos = Infinity;
  for(const t of selectable){
    const pos = state.currentInput.indexOf(t.id);
    if(pos !== -1 && pos < firstPos){ first = t; firstPos = pos; }
  }
  if(first) selectTile(first.id);
}

document.addEventListener('keydown', (e)=>{
  if(!state || state.finished || state.waitingForNext) return;
  if(e.key === 'Backspace' && state.currentInput.length){
    const lastId = state.currentInput[state.currentInput.length-1];
    selectTile(lastId);
    return;
  }
  if(e.key === 'Escape'){
    const w = currentWordObj();
    const hinted = w.letters.find(t => t.hinted);
    w.letters.forEach(t => { if(!t.hinted) t.used = false; });
    state.currentInput = hinted ? [hinted.id] : [];
    renderTiles();
    renderSlots();
    return;
  }
  if(e.key === '1'){ useShuffle(); return; }
  if(e.key === '2'){ useHint(); return; }
  if(e.key === '3'){ useDefinitionHint(); return; }
  if(e.key === '4'){ useSkip(); return; }
  if(e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey){
    const letter = e.key.toUpperCase();
    if(/^[A-ZÄÖÜẞ]$/.test(letter)) letterKeyPress(letter);
  }
});

/* ---------- Word bank loading ---------- */
async function loadWordBank(lang){
  const jsonUrl = lang === 'de' ? 'dewiktionary_words.json' : 'wordnet_words.json';
  try{
    const resp = await fetch(jsonUrl);
    if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    if(!Array.isArray(data) || data.length < 18) throw new Error('unexpected data shape');
    RAW_BANKS[lang] = data;
  } catch(err){
    console.warn(`Could not load ${jsonUrl}, using compact fallback word bank instead:`, err);
  }
}

/* ---------- Init ---------- */
document.getElementById('randomBtn').addEventListener('click', ()=> newGame('random', null, state.pack));
document.getElementById('packSelect').addEventListener('change', (e)=>{
  // Reinterpret the SAME puzzle identity (daily or random) under the new
  // pack/language, rather than forcing a fresh random seed — so switching
  // while on today's daily puzzle keeps it "today's puzzle", just from a
  // different word list.
  const seedPart = (parseHash() || {}).seed;
  newGame(null, seedPart, e.target.value);
});

Promise.all([loadWordBank('en'), loadWordBank('de')]).then(()=>{
  const parsed = parseHash();
  if(parsed && parsed.seed){
    newGame(null, parsed.seed, parsed.pack);
  } else {
    newGame('daily', null, 'all');
  }
});
